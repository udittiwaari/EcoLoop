services:
  - type: web
    name: ecoloop-api
    runtime: node
    plan: starter
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/backend/data
      - key: CORS_ORIGINS
        value: https://udittiwaari.github.io
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: ecoloop-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

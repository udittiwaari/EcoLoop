<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <!-- Primary Deep Blue Gradient -->
    <linearGradient id="loopBlue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <!-- Vibrant Cyan/Ocean Blue Accent Gradient -->
    <linearGradient id="loopBlue2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- ICON: Infinity Loop + Leaf + Circular Arrow -->
  <g transform="translate(15, 20)">
    <!-- Left Loop (Deep Royal/Navy Blue) -->
    <path d="M 55 50 
             C 35 20, 5 20, 5 50 
             C 5 80, 35 80, 55 50 
             C 75 20, 105 20, 105 50" fill="none" stroke="url(#loopBlue1)" stroke-width="14" stroke-linecap="round" />

    <!-- Right Loop with Arrow Flow (Vibrant Sky/Cyan Blue) -->
    <path d="M 105 50 
             C 105 80, 75 80, 55 50 
             L 44 35" fill="none" stroke="url(#loopBlue2)" stroke-width="14" stroke-linecap="round" />

    <!-- Upward Circular Value Arrowhead -->
    <polygon points="33,38 42,18 58,31" fill="#0EA5E9" />

    <!-- Organic Leaf Detail on Top Right of the Loop -->
    <path d="M 98 22 C 112 10, 125 18, 114 34 C 106 28, 102 26, 98 22 Z" fill="#38BDF8" />
    
    <!-- Sparkle/Value Node -->
    <circle cx="30" cy="50" r="4" fill="#E0F2FE" />
  </g>

  <!-- WORDMARK: EcoLoop -->
  <g transform="translate(155, 83)">
    <text font-family="&#39;Plus Jakarta Sans&#39;, &#39;Inter&#39;, system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      <tspan fill="#0F2C59">Eco</tspan><tspan fill="#0284C7" font-weight="600">Loop</tspan>
    </text>
  </g>
</svg>
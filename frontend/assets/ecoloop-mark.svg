<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 100" width="160" height="123">
  <defs>
    <!-- Primary Deep Blue Gradient -->
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <!-- Vibrant Cyan/Ocean Blue Accent Gradient -->

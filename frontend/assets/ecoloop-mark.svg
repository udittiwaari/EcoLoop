    <path d="M 55 50 C 35 20, 5 20, 5 50 C 5 80, 35 80, 55 50 C 75 20, 105 20, 105 50" fill="none" stroke="url(#b1)" stroke-width="14" stroke-linecap="round" />
    <!-- Right Loop -->
    <path d="M 105 50 C 105 80, 75 80, 55 50 L 44 35" fill="none" stroke="url(#b2)" stroke-width="14" stroke-linecap="round" />
    <!-- Arrowhead -->
    <polygon points="33,38 42,18 58,31" fill="#0EA5E9" />
    <!-- Top-Right Leaf -->
    <path d="M 98 22 C 112 10, 125 18, 114 34 C 106 28, 102 26, 98 22 Z" fill="#38BDF8" />
